# docker-compose.yml
# Isle Agent mDNS Receiver - Receives mDNS data from localhost-mdns on host
# Based on mesh-prototypes/localhost-mdns/docker-compose.lh-mdns.yml

version: '3.8'

services:
  isle-agent-mdns:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isle-agent-mdns
    restart: unless-stopped

    ports:
      # Map port 8888 so localhost-mdns on host can POST to it
      - "8888:8888"

    networks:
      - isle-mdns-net

    labels:
      isle.component: "agent-mdns"
      isle.role: "mdns-receiver"
      isle.version: "1.0.0"

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8888/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  isle-mdns-net:
    driver: bridge
    name: isle-mdns-net
