version: '3.8'

# Isle Agent - Three Component Architecture
# 1. isle-host-agent: Host systemd service (broadcasts/relays mDNS)
# 2. isle-agent-sync: Python container (receives mDNS, generates configs)
# 3. isle-vlan-agent: Nginx container (proxies HTTP/HTTPS traffic)

services:
  # === Component 2: mDNS Sync Container ===
  isle-agent-sync:
    build:
      context: ./isle-agent-sync
      dockerfile: Dockerfile
    container_name: isle-agent-sync
    restart: unless-stopped

    ports:
      - "8888:8888"  # API port for receiving mDNS data

    volumes:
      # Shared volume for generated nginx configs
      - agent-configs:/app/configs

      # Read-only access to host registry (monitors for changes)
      - /etc/isle-mesh/agent/registry.json:/app/registry.json:ro

      # Read-only access to template segments for config generation
      - ./segments:/app/segments:ro
      - ./templates:/app/templates:ro

      # Optional: persist service registry
      - /etc/isle-mesh/agent/sync-data:/app/data

    networks:
      - isle-agent-net

    labels:
      isle.component: "agent-sync"
      isle.role: "mdns-receiver"
      isle.version: "1.0.0"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # === Component 3: VLAN Agent (nginx proxy) ===
  isle-vlan-agent:
    build:
      context: ./isle-vlan-agent
      dockerfile: Dockerfile
    container_name: isle-vlan-agent
    restart: unless-stopped

    # Virtual MAC address for OpenWRT DHCP isolation
    # Format: 02:00:00:00:VLAN:XX (locally administered)
    mac_address: "02:00:00:00:0a:01"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Master nginx config
      - ./isle-vlan-agent/nginx.conf:/etc/nginx/nginx.conf:ro

      # App config fragments (generated by isle-agent-sync)
      - agent-configs:/etc/nginx/configs:ro

      # Read-only access to host registry (for status/monitoring)
      - /etc/isle-mesh/agent/registry.json:/etc/nginx/registry.json:ro

      # SSL certificates (shared across all apps)
      - /etc/isle-mesh/agent/ssl/certs:/etc/nginx/ssl/certs:ro
      - /etc/isle-mesh/agent/ssl/keys:/etc/nginx/ssl/keys:ro

      # Agent state and logs
      - /etc/isle-mesh/agent/logs:/var/log/nginx

    networks:
      isle-agent-net:
        priority: 100
      # Uncomment to connect to isle-br-0 for OpenWRT integration
      # isle-br-0:
      #   priority: 200

    depends_on:
      - isle-agent-sync

    labels:
      isle.component: "vlan-agent"
      isle.role: "proxy"
      isle.version: "1.0.0"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Shared volume for nginx config fragments
  agent-configs:
    name: isle-agent-configs

networks:
  # Internal docker network for app containers to reach agent
  isle-agent-net:
    driver: bridge
    name: isle-agent-net
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Macvlan network on isle-br-0 for OpenWRT router connectivity
  # Uncomment when ready to connect to OpenWRT router
  # Requirements:
  #   1. Host bridge isle-br-0 must exist (created by agent-manager.sh)
  #   2. OpenWRT router's eth1 connected to isle-br-0 bridge
  #   3. Agent uses virtual MAC (02:00:00:00:0a:01) for DHCP isolation
  # isle-br-0:
  #   driver: macvlan
  #   driver_opts:
  #     parent: isle-br-0
  #   name: isle-br-0
