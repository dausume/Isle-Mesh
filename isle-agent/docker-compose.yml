version: '3.8'

# Isle Agent - Two Component Architecture
# 1. isle-host-agent: Host systemd service (writes to registry.json)
# 2. isle-vlan-agent: Self-reloading Nginx proxy (watches registry.json)

services:
  # === VLAN Agent - Self-Reloading Nginx Proxy ===
  isle-vlan-agent:
    build:
      context: ./isle-vlan-agent
      dockerfile: Dockerfile
    container_name: isle-vlan-agent
    restart: unless-stopped

    # Virtual MAC address for OpenWRT DHCP isolation
    # Format: 02:00:00:00:VLAN:XX (locally administered)
    mac_address: "02:00:00:00:0a:01"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Initial/template nginx configs (read-only source)
      - ./isle-vlan-agent/nginx.conf:/etc/nginx/nginx-initial.conf:ro

      # Read-only access to host registry (watched for changes)
      # The vlan agent watches this file and regenerates configs automatically
      - /etc/isle-mesh/agent/registry.json:/etc/nginx/registry.json:ro

      # Active nginx main config (observable on host)
      # Initial config is copied here on startup
      - /etc/isle-mesh/agent/nginx/nginx.conf:/etc/nginx/nginx.conf:rw

      # Generated app configs (observable on host for debugging)
      # These are the auto-generated proxy configs from registry.json
      - /etc/isle-mesh/agent/nginx/configs:/etc/nginx/configs:rw

      # SSL certificates (shared across all apps)
      - /etc/isle-mesh/agent/ssl/certs:/etc/nginx/ssl/certs:ro
      - /etc/isle-mesh/agent/ssl/keys:/etc/nginx/ssl/keys:ro

      # Agent logs
      - /etc/isle-mesh/agent/logs:/var/log/nginx

    networks:
      isle-agent-net:
        priority: 100
      # Uncomment to connect to isle-br-0 for OpenWRT integration
      # isle-br-0:
      #   priority: 200

    labels:
      isle.component: "vlan-agent"
      isle.role: "self-reloading-proxy"
      isle.version: "2.0.0"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Internal docker network for app containers to reach agent
  isle-agent-net:
    driver: bridge
    name: isle-agent-net
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Macvlan network on isle-br-0 for OpenWRT router connectivity
  # Uncomment when ready to connect to OpenWRT router
  # Requirements:
  #   1. Host bridge isle-br-0 must exist (created by agent-manager.sh)
  #   2. OpenWRT router's eth1 connected to isle-br-0 bridge
  #   3. Agent uses virtual MAC (02:00:00:00:0a:01) for DHCP isolation
  # isle-br-0:
  #   driver: macvlan
  #   driver_opts:
  #     parent: isle-br-0
  #   name: isle-br-0
