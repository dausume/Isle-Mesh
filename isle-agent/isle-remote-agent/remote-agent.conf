# Isle Remote Agent Configuration
# This file stores runtime configuration for remote mode

# Discovery timeout in seconds (how long to wait for a beacon)
DISCOVERY_TIMEOUT=60

# Discovery port (must match router's beacon port)
DISCOVERY_PORT=7878

# Auto-detect physical interface (override with --interface)
# AUTO_INTERFACE=true

# DHCP wait timeout in seconds (container waiting for DHCP lease)
DHCP_TIMEOUT=30
