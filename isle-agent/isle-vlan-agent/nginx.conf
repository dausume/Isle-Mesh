# Isle VLAN Agent - Main Nginx Configuration
# This is the master nginx config that includes all app fragments

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Health check server - responds to health.local
    server {
        listen 80;
        listen [::]:80;

        server_name health.local;

        # Health check endpoint
        location / {
            access_log off;
            return 200 "isle-agent healthy\nmesh-mdns: broadcasting\nnginx: operational\n";
            add_header Content-Type text/plain;
        }

        location /health {
            access_log off;
            return 200 "isle-agent healthy\nmesh-mdns: broadcasting\nnginx: operational\n";
            add_header Content-Type text/plain;
        }
    }

    # Default server - health check
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "isle-vlan-agent healthy\n";
            add_header Content-Type text/plain;
        }

        # Default page (when no apps registered)
        location / {
            return 404 "No mesh apps registered\n";
            add_header Content-Type text/plain;
        }
    }

    # Include all app config fragments
    # These are generated by isle-agent-sync and placed in /etc/nginx/configs/
    include /etc/nginx/configs/*.conf;
}
