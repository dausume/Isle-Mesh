# Isle Host Agent Configuration
# Extends the existing mesh-mdns system for agent-specific functionality

# === Mode Configuration ===
# broadcast: Use existing mesh-mdns system only (default, minimal overhead)
# relay: Don't broadcast mDNS, just relay to sync container
# both: Broadcast mDNS AND relay to sync container
ISLE_AGENT_MODE=broadcast

# === Relay Configuration (only used in 'relay' or 'both' modes) ===
# Endpoint for isle-agent-sync container
SYNC_ENDPOINT=http://localhost:8888/mdns

# How often to relay domain info to sync (seconds)
RELAY_INTERVAL=30

# === Domain List ===
# Uses the same domain list as mesh-mdns
DOMAIN_LIST_FILE=/usr/local/etc/mesh-mdns-domains.list

# === Broadcast Configuration (inherited from mesh-mdns) ===
# Target IP for mDNS broadcasts
TARGET_IP=127.0.0.1

# Maximum concurrent avahi-publish processes
MAX_CONCURRENT=0

# Enable verbose logging
VERBOSE=false
