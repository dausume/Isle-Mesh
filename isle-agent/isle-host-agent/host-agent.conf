# Isle Host Agent Configuration
# Consolidated service: mDNS broadcasting, registry updates, and auto-sync

# === Mode Configuration ===
# broadcast: Use existing mesh-mdns system only (minimal overhead)
# registry: Update registry.json and watch for changes (includes auto-sync to mDNS)
# both: Full mode - broadcast mDNS, update registry, and auto-sync (recommended)
ISLE_AGENT_MODE=both

# === Registry Configuration ===
# Path to registry.json (watched by isle-vlan-agent and synced to mDNS)
REGISTRY_FILE=/etc/isle-mesh/agent/registry.json

# How often to update registry (seconds)
RELAY_INTERVAL=30

# === Domain List ===
# Uses the same domain list as mesh-mdns
DOMAIN_LIST_FILE=/usr/local/etc/mesh-mdns-domains.list

# === Registry Watcher Configuration ===
# Watch method: auto (use inotify if available, else polling), true (force inotify), false (force polling)
USE_INOTIFY=auto

# Polling interval for registry changes (seconds) - only used when not using inotify
WATCH_INTERVAL=5

# === Broadcast Configuration (inherited from mesh-mdns) ===
# Target IP for mDNS broadcasts
TARGET_IP=127.0.0.1

# Maximum concurrent avahi-publish processes
MAX_CONCURRENT=0

# Enable verbose logging
VERBOSE=false
