# isle-content-host: read-only static server for /data (the proven dataset root).
# Port 80 only; the isle agent terminates TLS. Request bodies are never logged.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 80 default_server;
        server_name _;

        # Published dataset: only the "current" generation is reachable.
        root /data/current;
        autoindex on;

        # Control files (latest.json, manifest-<sha>.json, current). Nothing else
        # under /data (store/, staging/, binding.json) is exposed.
        location /.well-known/isle-storage/ {
            alias /data/control/;
            autoindex off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # control/current is a one-line file holding the contentSha.
        location = /.well-known/isle-storage/current {
            alias /data/control/current;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
        }
    }
}
