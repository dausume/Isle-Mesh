# file-store: one small, complete file store (SeaweedFS, the stock image) on one partition. Its index and its
# content both live in the storage slot "files" (role blob), which the device binds to one of its partitions;
# the app is never started without it. Only the S3 door (8333) is open to other containers, and the device's
# agent is what reaches it; the master, the volume server and the filer listen inside the container only.
# The image name below is a placeholder; `isle store build` writes the built name in its place.
# PIN-AT-BUILD (this marker line is dropped from built output)
services:
  store:
    image: file-store/seaweedfs:PIN-AT-BUILD
    restart: "no"
    command:
      - server
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -s3.ip.bind=0.0.0.0
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    stop_grace_period: 60s
    expose:
      - "8333"
