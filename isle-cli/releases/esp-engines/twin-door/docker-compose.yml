# twin-esp-engines: the twin door in front of the esp-engines worker (c3g-4). The SAME image as the worker,
# with the door's command: twin_door.py, one WebSocket port that joins a caller on another device to a twin
# session's control line or serial stream, after the worker has checked the session's token. It mirrors the
# installed door of the board worker (twin-board-engines).
#
# The image is the one `isle store build` names for esp-engines (<release name>/<label>:<version>). Keep this tag
# equal to release.json's version. The door reaches the worker by its service name on the agent network, so no
# container or machine name is written here.
#
#   isle app deploy twin-esp-engines --compose <this file> --service twin-door --port 9864 --domain twin.esp-engines.isle
services:
  twin-door:
    image: esp-engines/esp-engines:2026.11.23-1
    command: ["python3", "/srv/twin_door.py"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      TWIN_DOOR_WORKER: "http://esp-engines:9850"
      TWIN_DOOR_PORT: "9864"
