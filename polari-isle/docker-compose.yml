# prf-isle — LEAN polari instance served ONLY through the isle
# (mac-2/3 first combined deployment, 2026-08-08).
# NO published ports: the isle-vlan-agent is the sole ingress
# (polari.isle -> frontend, api.polari.isle -> backend). sqlite,
# no Keycloak (read-only surfaces are unauthenticated; auth
# arrives with the full tier later).
services:
  backend:
    # the PUBLISHED image by default (a deb from the website must work without a local build — 2026-09-13 finding);
    # a developer overrides both with polari-isle/.env (POLARI_IMAGE_REPO= POLARI_IMAGE_TAG=staging) for local images
    image: ${POLARI_IMAGE_REPO:-ghcr.io/dausume/}prf-backend:${POLARI_IMAGE_TAG:-polari-v2026.09.12-core}
    container_name: prf-isle-backend
    restart: unless-stopped
    networks: [isle-agent-net]
    environment:
      - DEPLOY_ENV=staging
      - IN_DOCKER_CONTAINER=true
      - POLARI_INSTANCE_NAME=prf-isle
      - POLARI_INSTANCE_ID=isle
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/data/polari.db
      - OBJECT_STORAGE_ENABLED=false
      - SSL_ENABLED=false
      - CORS_ENABLED=true
      - CORS_ORIGINS=https://polari.isle,http://polari.isle
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_PORT=3001
      - POLARI_MODULES=${POLARI_ISLE_MODULES:-islemesh}
      - POLARI_POSTURE=${POLARI_POSTURE:-production}   # dev|production: the store's install-mode door writes it to .env; dev shows the standing warning
      - POLARI_LAZY_BOOT=1
    volumes:
      - backend-data:/data
    mem_limit: 2g
  frontend:
    image: ${POLARI_IMAGE_REPO:-ghcr.io/dausume/}prf-frontend:${POLARI_IMAGE_TAG:-polari-v2026.09.12-core}
    container_name: prf-isle-frontend
    restart: unless-stopped
    networks: [isle-agent-net]
    volumes:
      - ./runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    mem_limit: 128m
    depends_on: [backend]
volumes:
  backend-data:
networks:
  isle-agent-net:
    external: true
